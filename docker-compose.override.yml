# Local development layer, loaded automatically by `docker compose up`.
# Builds images from source, mounts code for live edits, publishes ports to localhost,
# and turns off the Airflow login. Never used on the server.

x-local-airflow: &local-airflow
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  environment: &local-env
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"  # no login screen, localhost only
    ALERT_PREFIX: "[local]"  # Telegram alerts from this stack are marked; production sends none
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/project/src
    - ./config:/opt/airflow/project/config
    - ./migrations:/opt/airflow/project/migrations
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data

services:
  warehouse-db:
    ports: ["127.0.0.1:5433:5432"]  # Postico / psql from the host

  redis:
    ports: ["127.0.0.1:6379:6379"]  # redis-cli / RedisInsight from the host

  warehouse-migrate: *local-airflow
  airflow-init: *local-airflow
  airflow-bootstrap: *local-airflow
  airflow-scheduler: *local-airflow
  airflow-dag-processor: *local-airflow
  airflow-triggerer: *local-airflow
  airflow-apiserver:
    <<: *local-airflow
    ports: ["127.0.0.1:8080:8080"]

  api:
    build: ./api
    environment:
      ALERT_PREFIX: "[local]"  # the event relay's channel posts from this stack are marked
    ports: ["127.0.0.1:8081:8081"]

  # Optional Redis GUI: docker compose --profile tools up -d redisinsight → http://localhost:5540
  # First time: "Add Redis database" → host "redis", port 6379 (it's saved in the volume).
  redisinsight:
    image: redis/redisinsight:3.8.0
    profiles: [tools]
    ports: ["127.0.0.1:5540:5540"]
    volumes: [redisinsight-data:/data]
    depends_on: [redis]

volumes:
  redisinsight-data:
