name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commits:
    # Hooks can be skipped with --no-verify; this can't. Same script as the local hooks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Commit messages follow Conventional Commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="$HEAD"         # first push of a branch: check its whole history
          else
            range="$BASE..$HEAD"
          fi
          ./scripts/check-commit-msg.sh --range "$range"

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: eventalpha
          POSTGRES_PASSWORD: eventalpha
          POSTGRES_DB: eventalpha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eventalpha" --health-interval 5s --health-retries 10
    env:
      EVENTALPHA_DATABASE_URL: postgresql+psycopg://eventalpha:eventalpha@localhost:5432/eventalpha
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Migrations apply and match the models
        run: uv run alembic upgrade head && uv run alembic check
      - name: API test schema is in sync with Alembic
        run: ./scripts/export-schema.sh && git diff --exit-code api/src/test/resources/db/schema.sql

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test --console=plain  # Testcontainers uses the runner's Docker

  web:
    # Vercel deploys web/ on every push; this fails the PR first if the UI doesn't build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build  # CI=true on GitHub runners: lint warnings fail the build

  airflow-dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the Airflow image and check every DAG imports
        run: |
          docker build -f docker/airflow.Dockerfile -t eventalpha-airflow:ci .
          # PYTHONPATH: Airflow's DAG processor puts the dags folder on sys.path; a bare DagBag doesn't.
          docker run --rm -e SEC_USER_AGENT=ci -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            -e PYTHONPATH=/opt/airflow/dags:/opt/airflow/project/src \
            eventalpha-airflow:ci python -c "
          from airflow.models.dagbag import DagBag
          bag = DagBag('/opt/airflow/dags')  # examples are off via AIRFLOW__CORE__LOAD_EXAMPLES
          assert not bag.import_errors, bag.import_errors
          print(sorted(bag.dag_ids))"

  images:
    # Only on main, after every check passes: publish images tagged with the commit SHA.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, java, airflow-dags]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/airflow.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/eventalpha-airflow:${{ github.sha }}
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,mode=max,scope=airflow
      - uses: docker/build-push-action@v7
        with:
          context: api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/eventalpha-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
