name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read-only token for every job unless it asks for more (images: packages).
# Actions are pinned to commit SHAs (tags can be moved); Dependabot keeps the pins current.
permissions:
  contents: read

jobs:
  commits:
    # Hooks can be skipped with --no-verify; this can't. Same script as the local hooks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages follow Conventional Commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="$HEAD"         # first push of a branch: check its whole history
          else
            range="$BASE..$HEAD"
          fi
          ./scripts/check-commit-msg.sh --range "$range"
      - name: No secrets in the pushed commits (gitleaks)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --log-opts="$range"

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: eventalpha
          POSTGRES_PASSWORD: eventalpha
          POSTGRES_DB: eventalpha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eventalpha" --health-interval 5s --health-retries 10
    env:
      EVENTALPHA_DATABASE_URL: postgresql+psycopg://eventalpha:eventalpha@localhost:5432/eventalpha
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy
      - name: Tests with coverage (floor in pyproject.toml; Postgres tests run in Testcontainers)
        run: uv run pytest -q --cov --cov-report=term-missing:skip-covered
      - name: Airflow image requirements match pyproject.toml
        run: uv run python scripts/check-airflow-requirements.py
      - name: Migrations apply and match the models
        run: uv run alembic upgrade head && uv run alembic check
      - name: API test schema is in sync with Alembic
        run: ./scripts/export-schema.sh && git diff --exit-code api/src/test/resources/db/schema.sql

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
      - run: ./gradlew test --console=plain  # Testcontainers uses the runner's Docker

  web:
    # Vercel deploys web/ on every push; this fails the PR first if the UI doesn't build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false  # Jest via react-scripts
      - run: npm run build  # CI=true on GitHub runners: lint warnings fail the build

  airflow-dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the Airflow image and check every DAG imports
        run: |
          docker build -f docker/airflow.Dockerfile -t eventalpha-airflow:ci .
          # PYTHONPATH: Airflow's DAG processor puts the dags folder on sys.path; a bare DagBag doesn't.
          docker run --rm -e SEC_USER_AGENT=ci -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            -e PYTHONPATH=/opt/airflow/dags:/opt/airflow/project/src \
            eventalpha-airflow:ci python -c "
          from airflow.models.dagbag import DagBag
          bag = DagBag('/opt/airflow/dags')  # examples are off via AIRFLOW__CORE__LOAD_EXAMPLES
          assert not bag.import_errors, bag.import_errors
          print(sorted(bag.dag_ids))"

  images:
    # Only on main, after every check passes: publish images tagged with the commit SHA.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, java, airflow-dags]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/airflow.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/eventalpha-airflow:${{ github.sha }}
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,mode=max,scope=airflow
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/eventalpha-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
