# Weekly dependency updates, grouped per ecosystem so they arrive as a few PRs, not dozens.
# Commit messages are Conventional ("build(deps): ...", "ci(deps): ...") to pass the commits check.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly, day: monday}
    groups: {python: {patterns: ["*"]}}
    commit-message: {prefix: build, include: scope}
    ignore:
      # Pinned to the version the Airflow image ships (pyproject.toml: >=2.0,<2.1); moves with Airflow.
      - dependency-name: sqlalchemy
        versions: [">=2.1"]

  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly, day: monday}
    groups: {web: {patterns: ["*"]}}
    commit-message: {prefix: build, include: scope}
    ignore:
      # Major upgrades of the UI stack are planned work, not routine bumps.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip  # Airflow image requirements
    directory: /docker
    schedule: {interval: weekly, day: monday}
    groups: {airflow-image: {patterns: ["*"]}}
    commit-message: {prefix: build, include: scope}

  - package-ecosystem: gradle
    directory: /api
    schedule: {interval: weekly, day: monday}
    groups: {api: {patterns: ["*"]}}
    commit-message: {prefix: build, include: scope}

  - package-ecosystem: docker
    directory: /docker
    schedule: {interval: weekly, day: monday}
    commit-message: {prefix: build, include: scope}

  - package-ecosystem: docker
    directory: /api
    schedule: {interval: weekly, day: monday}
    commit-message: {prefix: build, include: scope}

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    groups: {actions: {patterns: ["*"]}}
    commit-message: {prefix: ci, include: scope}
