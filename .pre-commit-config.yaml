# Local checks before each commit (run by .githooks/pre-commit) and in CI (pre-commit job).
#   uv run pre-commit run --all-files      # everything, on demand
# Generated or verbatim files stay byte-for-byte: schema.sql is pg_dump output that CI
# compares with a fresh export; LICENSE and CODE_OF_CONDUCT.md are official texts.
exclude: ^(api/src/test/resources/db/schema\.sql|LICENSE|CODE_OF_CONDUCT\.md)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # parse only: compose files use anchors and merge keys
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5  # keep in step with ruff in pyproject.toml
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks  # secrets in staged changes (keys, tokens, private keys)
