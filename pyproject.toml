[project]
name = "eventalpha"
version = "0.1.0"
description = "News + SEC 8-K ingestion, Jev sentiment classification, orchestrated with Airflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "boto3>=1.34",
    "feedparser>=6.0",
    "httpx>=0.27",
    "lxml>=5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6",
    "redis>=5.2",
    "sqlalchemy>=2.0,<2.1",  # matches the Airflow 3.4 image
    "typesafe-sdk>=0.7.5",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.20.1",
    "fakeredis[lua]>=2.26",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"migrations/*" = ["E402", "E501", "UP", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
